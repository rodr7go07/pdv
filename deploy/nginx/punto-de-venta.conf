# Nginx para el Punto de Venta (Laravel).
# Copiar a /etc/nginx/sites-available/punto-de-venta, cambiar TU-DOMINIO.COM y activar:
#   sudo ln -s /etc/nginx/sites-available/punto-de-venta /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Después, Certbot agrega el bloque HTTPS y la redirección:
#   sudo certbot --nginx -d TU-DOMINIO.COM --redirect --agree-tos -m tu-correo@ejemplo.com

server {
    listen 80;
    listen [::]:80;
    server_name TU-DOMINIO.COM;

    root /var/www/punto-de-venta/public;
    index index.php;

    charset utf-8;
    server_tokens off;                 # no anunciar la versión de nginx
    # Después de activar HTTPS con Certbot agrega aquí:
    # add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 10M;          # logotipos, imágenes de artículos y Excel de importación (máx. 5 MB)

    # Cabeceras de seguridad básicas
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # La cámara se permite solo al propio sitio: el escáner de códigos de barras del teléfono la necesita.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # El service worker debe poder actualizarse siempre
    # (un add_header dentro de location anula los del server: por eso se repiten las cabeceras de seguridad)
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Archivos compilados con hash en el nombre: se pueden guardar un año
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Solo index.php ejecuta PHP; cualquier otro .php (aunque alguien lo suba) se rechaza
    location ~ \.php$ {
        return 404;
    }

    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    # Nunca servir archivos ocultos (.env, .git…) salvo .well-known de Certbot
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/punto-de-venta.access.log;
    error_log  /var/log/nginx/punto-de-venta.error.log;
}
