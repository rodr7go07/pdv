; Worker de colas del Punto de Venta.
; Copiar a /etc/supervisor/conf.d/punto-de-venta-worker.conf y cargar:
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start punto-de-venta-worker:*
[program:punto-de-venta-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/punto-de-venta/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/punto-de-venta
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=deploy
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/punto-de-venta/storage/logs/worker.log
stopwaitsecs=3600
