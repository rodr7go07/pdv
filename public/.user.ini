; Límites de subida solo para este sistema (PHP-FPM lee este archivo en servidores con panel, como producción).
; Sin esto el servidor dejaba subir archivos de hasta 2 MB y el Excel de productos (máx. 5 MB) no llegaba a Laravel.
; Los cambios se aplican solos en unos 5 minutos (user_ini.cache_ttl).
upload_max_filesize = 10M
post_max_size = 12M
