<!doctype html>
<html lang="es-MX">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#141a4a">
    <title>Sin conexión</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            background-color: #141a4a;
            background-image: radial-gradient(circle, #1f2a68 1px, transparent 1px);
            background-size: 22px 22px;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            color: #11153a;
        }
        .ticket {
            width: 100%;
            max-width: 22rem;
            padding: 2rem 1.75rem 2.25rem;
            background: #fff;
            border-radius: .875rem .875rem 0 0;
            text-align: center;
            -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 10px 100%;
            mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 10px 100%;
        }
        .marca { width: 3rem; height: 3rem; color: #e4007c; }
        h1 { margin: .75rem 0 0; font-size: 1.5rem; font-weight: 900; text-transform: uppercase; color: #141a4a; }
        .rotulo { margin: .35rem 0 0; font: 500 .6875rem ui-monospace, Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; color: #3a4cb0; }
        hr { border: 0; border-top: 2px dashed #c9d1f4; margin: 1.25rem 0; }
        p { margin: 0 0 1.25rem; line-height: 1.5; color: #2d3b8f; }
        button {
            min-height: 2.75rem; padding: .625rem 1.5rem; border: 0; border-radius: .5rem;
            background: #e4007c; color: #fff; font: 800 .875rem system-ui, sans-serif;
            text-transform: uppercase; letter-spacing: .03em; cursor: pointer;
            box-shadow: 0 3px 0 0 #9c0054;
        }
        button:active { transform: translateY(3px); box-shadow: none; }
        :focus-visible { outline: 2px solid #e4007c; outline-offset: 2px; }
    </style>
</head>
<body>
    <main class="ticket">
        <svg class="marca" viewBox="0 0 40 40" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M4 9a5 5 0 0 1 5-5h13.2a5 5 0 0 1 3.9 1.9L35.4 18a3 3 0 0 1 0 4L26.1 34.1a5 5 0 0 1-3.9 1.9H9a5 5 0 0 1-5-5V9Zm9 7.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" clip-rule="evenodd"/>
        </svg>
        <h1>Sin conexión</h1>
        <p class="rotulo">No se puede vender sin internet</p>
        <hr>
        <p>Revisa que el dispositivo tenga internet o que el router haya cambiado a la red de respaldo. Tus ventas no se pierden: aquí no se guarda nada sin conexión.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
</body>
</html>
